server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Fichiers générés par Astro : leur nom change à chaque build, on peut les garder longtemps
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Nom attendu par beaucoup d'outils : renvoie vers l'index généré par Astro
    location = /sitemap.xml {
        return 301 /sitemap-index.xml;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
